name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk space
        # `cargo test` on Linux dies in the link with `ld terminated with signal 7 [Bus error]`
        # inside rust-lld, on a runner whose free space a 940-crate debug graph does not fit in.
        # GitHub treats that crash as disk exhaustion (actions/runner-images#13367), and this
        # image ships toolchains nobody here uses. Prints are the evidence if it happens again.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af > /dev/null
          df -h "$GITHUB_WORKSPACE" | tail -1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ pkg-config make cmake clang lld \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev

      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        # rustc reports a failed link as one ~64KB `cc` command line, and Actions drops that
        # line and everything after it — which is where the linker's actual complaint lives.
        # Long lines are filtered out so the short `ld:` notes survive, and PIPESTATUS keeps the
        # real exit code.
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" | tail -1
          du -sh target 2>/dev/null | sed 's|$|\ttarget dir|' || true
          cargo test 2>&1 | awk 'length($0) < 400'
          exit ${PIPESTATUS[0]}