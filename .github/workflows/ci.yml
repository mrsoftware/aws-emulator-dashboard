name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ pkg-config make cmake clang lld \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libva-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgbm-dev libdrm-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxss-dev libxxf86vm-dev

      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        # The link step is where a missing system library shows up, and rustc's diagnostic for
        # it is one enormous `cc` command line that Actions drops. Re-running the link verbosely
        # and printing the tail keeps the next red run self-explanatory.
        run: cargo test || { cargo test --no-run -v 2>&1 | tail -40; exit 1; }