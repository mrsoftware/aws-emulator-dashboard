name: Release

on:
  push:
    tags: ['v*']

# The default token is read-only on private repos; creating the release needs contents:write.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: aws-emulator-dashboard-macos-arm64.app.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: aws-emulator-dashboard-linux-x86_64.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aws-emulator-dashboard-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk space
        # Same 940-crate graph as CI; the Linux runner does not fit it without this.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af > /dev/null
          df -h "$GITHUB_WORKSPACE" | tail -1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ pkg-config make cmake clang lld \
            libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev

      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (macOS app bundle)
        # A release asset must be a single file, and Finder will only launch a `.app` that is
        # a real bundle (Contents/MacOS + Info.plist), so the binary is wrapped and zipped;
        # the zip is what preserves the bundle on download.
        if: runner.os == 'macOS'
        run: |
          APP="AWS Emulator Dashboard.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/${{ matrix.target }}/release/aws-emulator-dashboard "$APP/Contents/MacOS/aws-emulator-dashboard"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>AWS Emulator Dashboard</string>
            <key>CFBundleDisplayName</key><string>AWS Emulator Dashboard</string>
            <key>CFBundleIdentifier</key><string>io.github.mrsoftware.aws-emulator-dashboard</string>
            <key>CFBundleExecutable</key><string>aws-emulator-dashboard</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME}</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          zip -qry ${{ matrix.artifact }} "$APP"
          zip -qjry aws-emulator-dashboard-macos-arm64.zip target/${{ matrix.target }}/release/aws-emulator-dashboard
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          shasum -a 256 aws-emulator-dashboard-macos-arm64.zip > aws-emulator-dashboard-macos-arm64.zip.sha256

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          zip -qjry ${{ matrix.artifact }} target/${{ matrix.target }}/release/aws-emulator-dashboard
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/aws-emulator-dashboard.exe -DestinationPath ${{ matrix.artifact }}
          $hash = (Get-FileHash ${{ matrix.artifact }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File -Encoding ascii ${{ matrix.artifact }}.sha256

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "Changes in ${{ github.ref_name }}:"
            echo
            git log --pretty=format:'- %s (%h)' "$PREV..HEAD" || true
            echo
            echo
            echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$PREV...${{ github.ref_name }}"
          } > RELEASE_BODY.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aws-emulator-dashboard-*
          body_path: RELEASE_BODY.md
